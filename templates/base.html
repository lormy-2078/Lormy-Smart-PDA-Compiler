<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Pro Forma Disbursement Account Platform{% endblock %}</title>
<style>
  :root { --navy:#1F3864; --navy-light:#D9E2F3; --amber:#FFF2CC; --red:#C00000; --border:#BFBFBF; }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #F4F6FA; color: #1a1a1a; }
  header { background: var(--navy); color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  header .brand { font-size: 18px; font-weight: bold; }
  header .brand small { display:block; font-weight: normal; font-size: 11px; opacity: 0.8; }
  nav a { color: #fff; text-decoration: none; margin-left: 18px; font-size: 14px; }
  nav a:hover { text-decoration: underline; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 20px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 20px; margin-bottom: 20px; }
  h1 { font-size: 20px; color: var(--navy); }
  h2 { font-size: 15px; color: var(--navy); border-bottom: 2px solid var(--navy-light); padding-bottom: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  th { background: var(--navy); color: #fff; }
  tr.subtotal { background: var(--navy-light); font-weight: bold; }
  tr.grandtotal { background: var(--amber); font-weight: bold; font-size: 14px; }
  .placeholder { color: var(--red); font-style: italic; font-size: 11px; }
  .badge { display:inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
  .badge.high { background:#DDEBD3; color:#2E7D32; }
  .badge.low { background:#FBE4E4; color:#C00000; }
  .badge.pda1only { background:#FBE4E4; color:#C00000; }
  .badge.split { background:#DDEBD3; color:#2E7D32; }
  form label { display:block; font-size: 12px; font-weight: bold; margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 7px; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; font-size: 13px; }
  .row { display:flex; gap: 16px; }
  .row > div { flex:1; }
  button, .btn { background: var(--navy); color:#fff; border:none; padding: 9px 16px; border-radius: 4px; cursor:pointer; font-size: 13px; text-decoration:none; display:inline-block; margin-top: 12px; }
  button:hover, .btn:hover { background:#16294a; }
  .btn.secondary { background:#6c757d; }
  .btn.export { background:#2E7D32; }
  .muted { color:#666; font-size: 12px; }
  .flash { background:#FFF2CC; border:1px solid #E0C560; padding:10px 14px; border-radius:4px; margin-bottom:16px; font-size:13px; }
  .tabs { display:flex; gap:4px; }
  .tab-btn { background:#E8ECF5; color:var(--navy); border:1px solid var(--border); border-bottom:none; padding:10px 20px; border-radius:6px 6px 0 0; cursor:pointer; font-size:14px; font-weight:bold; margin-top:0; }
  .tab-btn.active { background:var(--navy); color:#fff; }
  .tab-btn:disabled { background:#F4F6FA; color:#999; cursor:not-allowed; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  .tab-body { border:1px solid var(--border); border-radius:0 6px 6px 6px; padding:20px; background:#fff; }
  details.drivers { border:1px solid var(--border); border-radius:6px; margin-top:14px; background:#fbfcfe; }
  details.drivers > summary { cursor:pointer; padding:11px 14px; font-weight:bold; font-size:15px; color:var(--navy); list-style:none; }
  details.drivers > summary::-webkit-details-marker { display:none; }
  details.drivers > summary::before { content:"\25B8\00a0\00a0"; }
  details.drivers[open] > summary::before { content:"\25BE\00a0\00a0"; }
  details.drivers .drivers-body { padding:0 14px 12px; }
  details.drivers:not([open]) .drivers-body { display:none; }
  /* Generic collapsible section -- expense tables (subtotal always visible in the
     summary, line items tucked away) and per-BL cards (same collapse behaviour,
     laid out as a .card so a collapsed BL still looks like a normal card). */
  details.section { border:1px solid var(--border); border-radius:6px; margin-top:10px; background:#fbfcfe; }
  details.section > summary { cursor:pointer; padding:9px 12px; font-weight:bold; font-size:14px; color:var(--navy); list-style:none; }
  details.section > summary::-webkit-details-marker { display:none; }
  details.section > summary::before { content:"\25B8\00a0\00a0"; }
  details.section[open] > summary::before { content:"\25BE\00a0\00a0"; }
  details.section table { margin:0 12px 12px; width:calc(100% - 24px); }
  details.card > summary { cursor:pointer; list-style:none; }
  details.card > summary::-webkit-details-marker { display:none; }
  details.card > summary::before { content:"\25B8\00a0\00a0"; }
  details.card[open] > summary::before { content:"\25BE\00a0\00a0"; }
  .rate-divider { display:flex; align-items:center; margin: 28px 0; color: var(--navy); font-weight:bold; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; }
  .rate-divider::before, .rate-divider::after { content:""; flex:1; border-bottom: 2px solid var(--navy); }
  .rate-divider span { padding: 0 14px; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <div class="brand">Pro Forma Disbursement Account Platform <small>Prototype &middot; Developed by Lormy</small></div>
  <nav>
    <a href="/calls/new">New Call</a>
    <a href="/rates">Rate Library</a>
    <a href="/tariff">Tariff Reference</a>
    <a href="/">History</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
